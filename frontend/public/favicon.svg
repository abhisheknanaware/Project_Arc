<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>
    <linearGradient id="wave2" x1="64" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#79c0ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect width="64" height="64" rx="14" fill="none" stroke="#58a6ff" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Floating particles -->
  <circle cx="12" cy="16" r="2.5" fill="#58a6ff" opacity="0.85" filter="url(#glow)"/>
  <circle cx="52" cy="14" r="1.8" fill="#00d2ff" opacity="0.75"/>
  <circle cx="32" cy="10" r="2"   fill="#79c0ff" opacity="0.8" filter="url(#glow)"/>
  <circle cx="50" cy="50" r="1.8" fill="#58a6ff" opacity="0.5"/>
  <circle cx="14" cy="48" r="2.2" fill="#00d2ff" opacity="0.6"/>
  <circle cx="38" cy="52" r="1.5" fill="#79c0ff" opacity="0.45"/>

  <!-- Air wave arcs (3 layers) -->
  <path
    d="M8 40 Q18 22 32 28 Q46 34 56 18"
    stroke="url(#wave1)"
    stroke-width="4"
    stroke-linecap="round"
    fill="none"
    filter="url(#glow)"
  />
  <path
    d="M8 48 Q19 31 33 37 Q47 43 56 28"
    stroke="url(#wave1)"
    stroke-width="3"
    stroke-linecap="round"
    fill="none"
    opacity="0.55"
  />
  <path
    d="M8 56 Q20 40 34 46 Q48 52 56 38"
    stroke="url(#wave2)"
    stroke-width="2.5"
    stroke-linecap="round"
    fill="none"
    opacity="0.35"
  />
</svg>